
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Budget Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #5146e5;
      --primary-dark: #4035c7;
      --background: #f5f6fa;
      --surface: #ffffff;
      --text: #202438;
      --muted: #73788c;
      --border: #e5e7ef;
      --danger: #d92d43;
      --success: #168653;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--primary);
      color: white;
      font-weight: 600;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button.secondary {
      background: #e9eaf8;
      color: var(--primary);
    }

    button.danger {
      background: #fff0f1;
      color: var(--danger);
    }

    button.small {
      padding: 6px 9px;
      font-size: 12px;
    }

    input, select {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--text);
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 13px;
      font-weight: 600;
    }

    .container {
      width: min(1100px, 94%);
      margin: 28px auto;
    }

    .auth-panel {
      width: min(420px, 94%);
      margin: 70px auto;
    }

    .panel, .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 14px rgba(20, 25, 50, .04);
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    h2 {
      font-size: 19px;
      margin: 0 0 14px;
    }

    h3 {
      font-size: 16px;
      margin: 0 0 8px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .topbar, .row, .actions, .month-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .topbar {
      margin-bottom: 22px;
    }

    .month-controls {
      margin: 20px 0;
    }

    .month-controls input {
      width: 180px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .summary-value {
      font-size: 23px;
      font-weight: 700;
      margin-top: 8px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin: 15px 0 25px;
    }

    .category-card {
      border: 1px solid var(--border);
      border-left: 5px solid var(--success);
      border-radius: 12px;
      padding: 16px;
      background: white;
    }

    .category-card.over {
      border-left-color: var(--danger);
      background: #fff5f5;
    }

    .category-card .amount {
      font-size: 20px;
      font-weight: 700;
      margin: 10px 0;
    }

    .progress {
      height: 9px;
      background: #eceef4;
      border-radius: 20px;
      overflow: hidden;
      margin: 10px 0;
    }

    .progress > div {
      height: 100%;
      background: var(--success);
      border-radius: 20px;
    }

    .progress > div.over {
      background: var(--danger);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .section {
      margin: 20px 0;
    }

    .expense-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .expense-item:last-child {
      border-bottom: 0;
    }

    .expense-amount {
      font-weight: 700;
      white-space: nowrap;
    }

    .message {
      margin-top: 12px;
      font-size: 13px;
    }

    .error {
      color: var(--danger);
    }

    .success {
      color: var(--success);
    }

    @media (max-width: 650px) {
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-grid .full {
        grid-column: auto;
      }

      .container {
        margin: 16px auto;
      }
    }
  </style>
</head>

<body>

  <!-- ======================================
       LOGIN AND SIGNUP
  ======================================= -->

  <section id="authSection" class="auth-panel panel">

    <h1>My Budget Tracker</h1>

    <p class="muted">
      Sign in to manage your personal monthly budget.
    </p>

    <label for="authEmail">Email</label>
    <input
      id="authEmail"
      type="email"
      placeholder="you@example.com"
      autocomplete="email"
    >

    <label for="authPassword">Password</label>
    <input
      id="authPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <div class="actions" style="margin-top:16px">
      <button id="loginBtn">Login</button>
      <button id="signupBtn" class="secondary">Create account</button>
    </div>

    <p style="margin-top:16px">
      <button id="resetPasswordBtn" class="secondary small">
        Forgot password?
      </button>
    </p>

    <div id="authMessage" class="message"></div>

  </section>


  <!-- ======================================
       MAIN APPLICATION
  ======================================= -->

  <main id="appSection" class="container hidden">

    <header class="topbar">

      <div>
        <h1>My Budget Tracker</h1>
        <div class="muted" id="signedInEmail"></div>
      </div>

      <button id="logoutBtn" class="secondary">
        Logout
      </button>

    </header>


    <!-- MONTHLY DASHBOARD -->

    <section class="panel">

      <div class="month-controls">

        <div>
          <h2>Monthly budget</h2>
          <div class="muted">
            Select a month to view or manage its budget.
          </div>
        </div>

        <input id="monthPicker" type="month">

      </div>


      <div class="summary-grid">

        <div class="card">
          <div class="muted">Total budget</div>
          <div class="summary-value" id="totalBudget">₹0.00</div>
        </div>

        <div class="card">
          <div class="muted">Total spent</div>
          <div class="summary-value" id="totalSpent">₹0.00</div>
        </div>

        <div class="card">
          <div class="muted">Remaining</div>
          <div class="summary-value" id="remaining">₹0.00</div>
        </div>

      </div>

    </section>


    <!-- CATEGORY FORM -->

    <section class="panel section">

      <h2 id="categoryFormTitle">Add a budget category</h2>

      <form id="categoryForm">

        <div class="form-grid">

          <div>
            <label for="categoryName">Category name</label>
            <input
              id="categoryName"
              required
              maxlength="60"
              placeholder="e.g. Daily spend, Shopping, Travel"
            >
          </div>

          <div>
            <label for="categoryBudget">Monthly budget (₹)</label>
            <input
              id="categoryBudget"
              type="number"
              min="0"
              step="0.01"
              required
              placeholder="e.g. 5000"
            >
          </div>

          <div class="full actions">

            <button type="submit" id="saveCategoryBtn">
              Add category
            </button>

            <button
              type="button"
              id="cancelCategoryEdit"
              class="secondary hidden"
            >
              Cancel edit
            </button>

          </div>

        </div>

      </form>

      <div id="categoryMessage" class="message"></div>

    </section>


    <!-- CATEGORY LIST -->

    <section class="section">

      <div class="row">
        <h2>Categories and spending</h2>

        <button id="copyPreviousBtn" class="secondary small">
          Copy previous month's categories
        </button>
      </div>

      <div id="categoryList" class="category-grid"></div>

    </section>


    <!-- EXPENSE FORM -->

    <section class="panel section">

      <h2 id="expenseFormTitle">Add an expense</h2>

      <form id="expenseForm">

        <div class="form-grid">

          <div>
            <label for="expenseCategory">Category</label>
            <select id="expenseCategory" required>
              <option value="">Select category</option>
            </select>
          </div>

          <div>
            <label for="expenseAmount">Amount (₹)</label>
            <input
              id="expenseAmount"
              type="number"
              min="0.01"
              step="0.01"
              required
              placeholder="e.g. 250"
            >
          </div>

          <div>
            <label for="expenseDate">Date</label>
            <input id="expenseDate" type="date" required>
          </div>

          <div>
            <label for="expenseDescription">Description</label>
            <input
              id="expenseDescription"
              maxlength="150"
              placeholder="e.g. Grocery shopping"
            >
          </div>

          <div class="full actions">

            <button type="submit" id="saveExpenseBtn">
              Add expense
            </button>

            <button
              type="button"
              id="cancelExpenseEdit"
              class="secondary hidden"
            >
              Cancel edit
            </button>

          </div>

        </div>

      </form>

      <div id="expenseMessage" class="message"></div>

    </section>


    <!-- EXPENSE HISTORY -->

    <section class="panel section">

      <div class="row">
        <h2>Expense history</h2>

        <button id="exportBtn" class="secondary small">
          Export backup (JSON)
        </button>
      </div>

      <div id="expenseList"></div>

    </section>

  </main>


  <!-- ======================================
       JAVASCRIPT
  ======================================= -->

  <script>

    // ======================================
    // 1. SUPABASE CONFIGURATION
    // ======================================

    const SUPABASE_URL = "https://hxsjeepavhglnqnyaspn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_oaol-3QzwysWxdDwyUjqow_Unp831Rx";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    // ======================================
    // 2. APPLICATION STATE
    // ======================================

    let currentUser = null;
    let currentMonthId = null;

    let categories = [];
    let transactions = [];

    let editingCategoryId = null;
    let editingExpenseId = null;

    let loadSequence = 0;

    const $ = id => document.getElementById(id);


    // ======================================
    // 3. COMMON UTILITIES
    // ======================================

    function money(value) {

      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR"
      }).format(Number(value || 0));

    }


    function todayString() {

      const date = new Date();

      const local = new Date(
        date.getTime() - date.getTimezoneOffset() * 60000
      );

      return local.toISOString().slice(0, 10);

    }


    function currentMonthString() {

      return todayString().slice(0, 7);

    }


    function escapeHtml(value) {

      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);

    }


    function showMessage(id, message, type = "") {

      const element = $(id);

      element.textContent = message;
      element.className = "message " + type;

    }


    function clearMessages() {

      ["categoryMessage", "expenseMessage"].forEach(id => {
        showMessage(id, "");
      });

    }


    // ======================================
    // 4. AUTHENTICATION
    // ======================================

    $("signupBtn").addEventListener("click", async () => {

      const email = $("authEmail").value.trim();
      const password = $("authPassword").value;

      if (!email || password.length < 8) {

        showMessage(
          "authMessage",
          "Enter an email and a password of at least 8 characters.",
          "error"
        );

        return;

      }

      const { data, error } = await db.auth.signUp({
        email,
        password
      });

      if (error) {

        showMessage("authMessage", error.message, "error");
        return;

      }

      if (data.session) {

        showMessage(
          "authMessage",
          "Account created. Signing you in...",
          "success"
        );

      } else {

        showMessage(
          "authMessage",
          "Account created. Check your email to confirm your account, then log in.",
          "success"
        );

      }

    });


    $("loginBtn").addEventListener("click", async () => {

      const email = $("authEmail").value.trim();
      const password = $("authPassword").value;

      const { error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {

        showMessage("authMessage", error.message, "error");

      }

    });


    $("resetPasswordBtn").addEventListener("click", async () => {

      const email = $("authEmail").value.trim();

      if (!email) {

        showMessage(
          "authMessage",
          "Enter your email address first.",
          "error"
        );

        return;

      }

      const redirectTo =
        window.location.origin + window.location.pathname;

      const { error } = await db.auth.resetPasswordForEmail(
        email,
        { redirectTo }
      );

      showMessage(
        "authMessage",
        error
          ? error.message
          : "Password reset email sent. Check your inbox.",
        error ? "error" : "success"
      );

    });


    $("logoutBtn").addEventListener("click", async () => {

      const { error } = await db.auth.signOut();

      if (error) {
        alert(error.message);
      }

    });


    // Auth callback: defer application work outside the callback.

    db.auth.onAuthStateChange((event, session) => {

      currentUser = session?.user ?? null;

      if (event === "PASSWORD_RECOVERY") {

        setTimeout(async () => {

          const newPassword = prompt(
            "Enter your new password (at least 8 characters):"
          );

          if (!newPassword || newPassword.length < 8) {

            alert(
              "Password was not changed. Use at least 8 characters."
            );

            return;

          }

          const { error } = await db.auth.updateUser({
            password: newPassword
          });

          alert(
            error
              ? error.message
              : "Password updated successfully."
          );

        }, 0);

      }

      setTimeout(() => updateAuthScreen(), 0);

    });


    async function updateAuthScreen() {

      if (!currentUser) {

        $("authSection").classList.remove("hidden");
        $("appSection").classList.add("hidden");

        currentMonthId = null;
        categories = [];
        transactions = [];

        return;

      }

      $("authSection").classList.add("hidden");
      $("appSection").classList.remove("hidden");

      $("signedInEmail").textContent = currentUser.email || "";

      if (!$("monthPicker").value) {
        $("monthPicker").value = currentMonthString();
      }

      await loadMonth();

    }


    // ======================================
    // 5. MONTH MANAGEMENT
    // ======================================

    $("monthPicker").addEventListener("change", async () => {

      resetForms();
      await loadMonth();

    });


    async function loadMonth() {

      if (!currentUser) return;

      clearMessages();

      const monthValue = $("monthPicker").value;

      if (!monthValue) return;

      const monthDate = monthValue + "-01";

      const { data, error } = await db
        .from("budget_months")
        .upsert(
          {
            user_id: currentUser.id,
            month: monthDate
          },
          {
            onConflict: "user_id,month"
          }
        )
        .select()
        .single();

      if (error) {

        alert("Could not load month: " + error.message);
        return;

      }

      currentMonthId = data.id;

      await loadMonthData();

    }


    async function loadMonthData() {

      if (!currentMonthId || !currentUser) return;

      const requestId = ++loadSequence;
      const selectedMonthId = currentMonthId;

      const [categoryResult, expenseResult] = await Promise.all([

        db
          .from("categories")
          .select("*")
          .eq("month_id", selectedMonthId)
          .order("name"),

        db
          .from("transactions")
          .select("*")
          .eq("user_id", currentUser.id)
          .order("spent_at", { ascending: false })
          .order("created_at", { ascending: false })

      ]);

      if (requestId !== loadSequence) return;

      if (categoryResult.error || expenseResult.error) {

        alert(
          "Could not load your budget data: " +
          (
            categoryResult.error?.message ||
            expenseResult.error?.message
          )
        );

        return;

      }

      categories = categoryResult.data || [];

      const categoryIds = new Set(
        categories.map(category => category.id)
      );

      transactions = (expenseResult.data || []).filter(
        transaction => categoryIds.has(transaction.category_id)
      );

      renderAll();

    }


    // ======================================
    // 6. CATEGORY MANAGEMENT
    // ======================================

    $("categoryForm").addEventListener("submit", async event => {

      event.preventDefault();

      const name = $("categoryName").value.trim();
      const budget = Number($("categoryBudget").value);

      if (
        !name ||
        !Number.isFinite(budget) ||
        budget < 0
      ) {

        showMessage(
          "categoryMessage",
          "Enter a valid category name and budget.",
          "error"
        );

        return;

      }

      const payload = {
        name,
        budget,
        user_id: currentUser.id,
        month_id: currentMonthId
      };

      let result;

      if (editingCategoryId) {

        result = await db
          .from("categories")
          .update({ name, budget })
          .eq("id", editingCategoryId)
          .eq("user_id", currentUser.id);

      } else {

        result = await db
          .from("categories")
          .insert(payload);

      }

      if (result.error) {

        showMessage(
          "categoryMessage",
          result.error.message,
          "error"
        );

        return;

      }

      resetCategoryForm();

      showMessage(
        "categoryMessage",
        "Category saved successfully.",
        "success"
      );

      await loadMonthData();

    });


    function editCategory(id) {

      const category = categories.find(c => c.id === id);

      if (!category) return;

      editingCategoryId = id;

      $("categoryName").value = category.name;
      $("categoryBudget").value = category.budget;

      $("categoryFormTitle").textContent = "Edit category";
      $("saveCategoryBtn").textContent = "Update category";

      $("cancelCategoryEdit").classList.remove("hidden");

      $("categoryForm").scrollIntoView({
        behavior: "smooth"
      });

    }


    async function deleteCategory(id) {

      const category = categories.find(c => c.id === id);

      if (!category) return;

      if (!confirm(
        `Delete "${category.name}" and all its expenses for this month?`
      )) return;

      const { error } = await db
        .from("categories")
        .delete()
        .eq("id", id)
        .eq("user_id", currentUser.id);

      if (error) {

        alert(error.message);
        return;

      }

      await loadMonthData();

    }


    function resetCategoryForm() {

      editingCategoryId = null;

      $("categoryForm").reset();

      $("categoryFormTitle").textContent =
        "Add a budget category";

      $("saveCategoryBtn").textContent = "Add category";

      $("cancelCategoryEdit").classList.add("hidden");

    }


    $("cancelCategoryEdit").addEventListener(
      "click",
      resetCategoryForm
    );


    // ======================================
    // 7. EXPENSE MANAGEMENT
    // ======================================

    $("expenseForm").addEventListener("submit", async event => {

      event.preventDefault();

      const categoryId = $("expenseCategory").value;
      const amount = Number($("expenseAmount").value);
      const spentAt = $("expenseDate").value;
      const description = $("expenseDescription").value.trim();

      if (
        !categoryId ||
        !Number.isFinite(amount) ||
        amount <= 0 ||
        !spentAt
      ) {

        showMessage(
          "expenseMessage",
          "Enter a category, valid amount and date.",
          "error"
        );

        return;

      }

      const payload = {
        user_id: currentUser.id,
        category_id: categoryId,
        amount,
        spent_at: spentAt,
        description
      };

      let result;

      if (editingExpenseId) {

        result = await db
          .from("transactions")
          .update({
            category_id: categoryId,
            amount,
            spent_at: spentAt,
            description
          })
          .eq("id", editingExpenseId)
          .eq("user_id", currentUser.id);

      } else {

        result = await db
          .from("transactions")
          .insert(payload);

      }

      if (result.error) {

        showMessage(
          "expenseMessage",
          result.error.message,
          "error"
        );

        return;

      }

      resetExpenseForm();

      showMessage(
        "expenseMessage",
        "Expense saved successfully.",
        "success"
      );

      await loadMonthData();

    });


    function editExpense(id) {

      const expense = transactions.find(t => t.id === id);

      if (!expense) return;

      editingExpenseId = id;

      $("expenseCategory").value = expense.category_id;
      $("expenseAmount").value = expense.amount;
      $("expenseDate").value = expense.spent_at;

      $("expenseDescription").value =
        expense.description || "";

      $("expenseFormTitle").textContent = "Edit expense";
      $("saveExpenseBtn").textContent = "Update expense";

      $("cancelExpenseEdit").classList.remove("hidden");

      $("expenseForm").scrollIntoView({
        behavior: "smooth"
      });

    }


    async function deleteExpense(id) {

      if (!confirm("Delete this expense?")) return;

      const { error } = await db
        .from("transactions")
        .delete()
        .eq("id", id)
        .eq("user_id", currentUser.id);

      if (error) {

        alert(error.message);
        return;

      }

      await loadMonthData();

    }


    function resetExpenseForm() {

      editingExpenseId = null;

      $("expenseForm").reset();

      $("expenseDate").value = todayString();

      $("expenseFormTitle").textContent = "Add an expense";
      $("saveExpenseBtn").textContent = "Add expense";

      $("cancelExpenseEdit").classList.add("hidden");

    }


    $("cancelExpenseEdit").addEventListener(
      "click",
      resetExpenseForm
    );


    function resetForms() {

      resetCategoryForm();
      resetExpenseForm();

    }


    // ======================================
    // 8. DASHBOARD RENDERING
    // ======================================

    function renderAll() {

      renderCategorySelect();
      renderSummary();
      renderCategories();
      renderExpenses();

    }


    function getCategorySpent(categoryId) {

      return transactions
        .filter(t => t.category_id === categoryId)
        .reduce(
          (sum, t) => sum + Number(t.amount),
          0
        );

    }


    function renderSummary() {

      const totalBudget = categories.reduce(
        (sum, c) => sum + Number(c.budget),
        0
      );

      const totalSpent = transactions.reduce(
        (sum, t) => sum + Number(t.amount),
        0
      );

      const remaining = totalBudget - totalSpent;

      $("totalBudget").textContent = money(totalBudget);
      $("totalSpent").textContent = money(totalSpent);
      $("remaining").textContent = money(remaining);

      $("remaining").style.color =
        remaining < 0
          ? "var(--danger)"
          : "var(--success)";

    }


    function renderCategorySelect() {

      const select = $("expenseCategory");

      const previousValue = select.value;

      select.innerHTML =
        '<option value="">Select category</option>';

      categories.forEach(category => {

        const option = document.createElement("option");

        option.value = category.id;
        option.textContent = category.name;

        select.appendChild(option);

      });

      if (categories.some(c => c.id === previousValue)) {
        select.value = previousValue;
      }

    }


    function renderCategories() {

      const container = $("categoryList");

      if (!categories.length) {

        container.innerHTML =
          '<div class="panel muted">' +
          'No categories yet. Add your first monthly budget category above.' +
          '</div>';

        return;

      }

      container.innerHTML = categories.map(category => {

        const spent = getCategorySpent(category.id);

        const budget = Number(category.budget);

        const over = spent > budget;

        const percent = budget > 0
          ? (spent / budget) * 100
          : (spent > 0 ? 100 : 0);

        const barWidth = Math.min(percent, 100);

        return `

          <article class="category-card ${over ? "over" : ""}">

            <div class="row">

              <h3>${escapeHtml(category.name)}</h3>

              <span class="muted">
                ${over ? "Over budget" : "Within budget"}
              </span>

            </div>

            <div class="amount">
              ${money(spent)}
            </div>

            <div class="muted">
              of ${money(budget)} budget
            </div>

            <div class="progress">
              <div
                class="${over ? "over" : ""}"
                style="width:${barWidth}%"
              ></div>
            </div>

            <div class="muted">
              ${percent.toFixed(1)}% used
              ${
                over
                  ? " · Exceeded by " + money(spent - budget)
                  : ""
              }
            </div>

            <div class="actions" style="margin-top:14px">

              <button
                class="secondary small"
                data-action="edit-category"
                data-id="${category.id}"
              >
                Edit
              </button>

              <button
                class="danger small"
                data-action="delete-category"
                data-id="${category.id}"
              >
                Delete
              </button>

              <button
                class="small"
                data-action="add-to-category"
                data-id="${category.id}"
              >
                Add expense
              </button>

            </div>

          </article>

        `;

      }).join("");

    }


    function renderExpenses() {

      const container = $("expenseList");

      if (!transactions.length) {

        container.innerHTML =
          '<p class="muted">No expenses recorded for this month.</p>';

        return;

      }

      const sorted = [...transactions].sort((a, b) => {

        return (
          b.spent_at.localeCompare(a.spent_at) ||
          b.created_at.localeCompare(a.created_at)
        );

      });

      container.innerHTML = sorted.map(expense => {

        const category = categories.find(
          c => c.id === expense.category_id
        );

        const categoryName = category
          ? category.name
          : "Unknown category";

        return `

          <div class="expense-item">

            <div>

              <strong>
                ${escapeHtml(expense.description || "Expense")}
              </strong>

              <div class="muted">
                ${escapeHtml(categoryName)}
                ·
                ${escapeHtml(expense.spent_at)}
              </div>

            </div>

            <div class="actions">

              <span class="expense-amount">
                ${money(expense.amount)}
              </span>

              <button
                class="secondary small"
                data-action="edit-expense"
                data-id="${expense.id}"
              >
                Edit
              </button>

              <button
                class="danger small"
                data-action="delete-expense"
                data-id="${expense.id}"
              >
                Delete
              </button>

            </div>

          </div>

        `;

      }).join("");

    }


    // ======================================
    // 9. DYNAMIC BUTTON EVENTS
    // ======================================

    document.addEventListener("click", event => {

      const button = event.target.closest(
        "button[data-action]"
      );

      if (!button) return;

      const id = button.dataset.id;
      const action = button.dataset.action;

      if (action === "edit-category") {
        editCategory(id);
      }

      if (action === "delete-category") {
        deleteCategory(id);
      }

      if (action === "edit-expense") {
        editExpense(id);
      }

      if (action === "delete-expense") {
        deleteExpense(id);
      }

      if (action === "add-to-category") {

        $("expenseCategory").value = id;
        $("expenseDate").value = todayString();

        $("expenseForm").scrollIntoView({
          behavior: "smooth"
        });

        $("expenseAmount").focus();

      }

    });


    // ======================================
    // 10. COPY PREVIOUS MONTH CATEGORIES
    // ======================================

    $("copyPreviousBtn").addEventListener(
      "click",
      async () => {

        const selectedMonth = $("monthPicker").value;

        if (!selectedMonth) return;

        const [year, month] = selectedMonth
          .split("-")
          .map(Number);

        const previousDate = new Date(
          year,
          month - 2,
          1
        );

        const previousMonth =
          previousDate.getFullYear() +
          "-" +
          String(previousDate.getMonth() + 1).padStart(2, "0") +
          "-01";

        const { data: previousBudget, error: monthError } =
          await db
            .from("budget_months")
            .select("id")
            .eq("user_id", currentUser.id)
            .eq("month", previousMonth)
            .maybeSingle();

        if (monthError) {

          alert(monthError.message);
          return;

        }

        if (!previousBudget) {

          alert("No budget found for the previous month.");
          return;

        }

        const { data: previousCategories, error } =
          await db
            .from("categories")
            .select("name,budget")
            .eq("month_id", previousBudget.id);

        if (error) {

          alert(error.message);
          return;

        }

        if (!previousCategories.length) {

          alert(
            "The previous month has no categories to copy."
          );

          return;

        }

        if (!confirm(
          "Copy previous month's categories and budgets into this month? Existing categories with the same names will be updated."
        )) return;

        const payload = previousCategories.map(category => ({
          user_id: currentUser.id,
          month_id: currentMonthId,
          name: category.name,
          budget: category.budget
        }));

        const { error: saveError } = await db
          .from("categories")
          .upsert(
            payload,
            { onConflict: "month_id,name" }
          );

        if (saveError) {

          alert(saveError.message);
          return;

        }

        await loadMonthData();

        alert(
          "Previous month's categories copied successfully."
        );

      }
    );


    // ======================================
    // 11. EXPORT SELECTED MONTH BACKUP
    // ======================================

    $("exportBtn").addEventListener("click", () => {

      const backup = {

        exportedAt: new Date().toISOString(),

        month: $("monthPicker").value,

        categories,

        transactions

      };

      const blob = new Blob(
        [JSON.stringify(backup, null, 2)],
        { type: "application/json" }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");

      link.href = url;

      link.download =
        `budget-backup-${$("monthPicker").value}.json`;

      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(url);

    });


    // ======================================
    // 12. INITIALIZATION
    // ======================================

    $("expenseDate").value = todayString();

    $("monthPicker").value = currentMonthString();


    if (
      SUPABASE_URL === "YOUR_SUPABASE_PROJECT_URL" ||
      SUPABASE_PUBLISHABLE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
    ) {

      showMessage(
        "authMessage",
        "First add your Supabase Project URL and publishable key in index.html.",
        "error"
      );

    } else {

      db.auth.getSession().then(({ data, error }) => {

        if (error) {

          showMessage(
            "authMessage",
            error.message,
            "error"
          );

          return;

        }

        currentUser = data.session?.user ?? null;

        updateAuthScreen();

      });

    }

  </script>

</body>
</html>
